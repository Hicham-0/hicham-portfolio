name: Portfolio CI & Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies deterministically
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript verification
        run: npm run typecheck

      - name: Build static production bundle
        run: npm run build